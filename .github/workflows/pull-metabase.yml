name: Daily Metabase CSV Pull

on:
  schedule:
    # Every day at 7:00 AM ET (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: # allows manual trigger from the GitHub Actions tab

jobs:
  pull-csvs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Pull CSVs from Metabase and import into Lovable Cloud
        env:
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: npx tsx scripts/pull-metabase.ts
