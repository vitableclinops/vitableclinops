name: ClinOps DB — Push migrations

# Pushes new SQL migrations from supabase/migrations/ to the ClinOps Supabase
# project (bbquooftytwprllipcsb). Without this workflow, migrations live in
# the repo but never reach the production database — exactly the bug that
# caused the workbench to render "no per-shift data" because the
# shift_recommendations EHR columns existed in code but not in the DB.
#
# Setup:
#   1. Generate an access token: https://supabase.com/dashboard/account/tokens
#      (must start with `sbp_…` — this is an account token, NOT a project key)
#   2. Add it as a repository secret named SUPABASE_ACCESS_TOKEN.
#   3. Get the project's database password:
#      https://supabase.com/dashboard/project/bbquooftytwprllipcsb/settings/database
#   4. Add it as a repository secret named SUPABASE_DB_PASSWORD.
#   5. Merge this workflow.
#
# What it does:
#   - On push to main when files in supabase/migrations/ or supabase/config.toml
#     change, applies any unapplied migrations to the ClinOps project.
#   - Can also be triggered manually via workflow_dispatch.
#
# Caveat: this repo's supabase/migrations/ directory contains migrations that
# reference the primary auth project's app_role / auth.uid() / user_roles —
# those will fail against the ClinOps project (which has no auth). Remote-only
# legacy versions are marked reverted; local migrations that intentionally do
# not belong in ClinOps are marked applied so db push skips them.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/clinops-db-push.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinops-db-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bbquooftytwprllipcsb
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity check — required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set (must start with 'sbp_'). Generate at https://supabase.com/dashboard/account/tokens."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set. Get it at https://supabase.com/dashboard/project/${PROJECT_REF}/settings/database."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Repair legacy remote-only migration versions
        run: |
          supabase migration repair --status reverted \
            20260506193208 \
            20260506211752 \
            20260512162717 \
            20260518182326 || true

      - name: Mark non-ClinOps local migrations as applied
        run: |
          supabase migration repair --status applied \
            20260602130013 \
            20260612212424 || true

      - name: List unapplied migrations
        run: supabase migration list --linked || true

      - name: Push migrations
        run: supabase db push --linked --include-all
