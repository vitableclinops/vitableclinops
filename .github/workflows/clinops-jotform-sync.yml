name: ClinOps — Jotform sync + evaluate

# Pulls new Jotform availability submissions into the ClinOps DB and runs
# the evaluator so the Scheduling Workbench shows new providers and shifts
# without manual intervention. Runs every 30 minutes.
#
# Pipeline:
#   1. POST sync-jotform-submissions  → upserts new rows into
#                                       public.schedule_submissions.
#   2. POST evaluate-schedule-submissions → expands pending submissions into
#                                            shift_recommendations rows so
#                                            the workbench's per-shift UI
#                                            populates.
#
# Functions are invoked via curl. The project's anon key is fetched on
# the fly from the Management API using the existing SUPABASE_ACCESS_TOKEN,
# so no additional secrets are needed.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinops-jotform-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bbquooftytwprllipcsb
    steps:
      - name: Sanity check — token is present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Fetch project anon key
        id: keys
        run: |
          # Fetch the project's anon key via the Management API so we don't
          # need to keep a separate GitHub secret in sync.
          response=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys")
          anon=$(echo "$response" | jq -r '.[] | select(.name=="anon") | .api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "::error::Failed to fetch anon key from Management API"
            echo "$response"
            exit 1
          fi
          echo "::add-mask::$anon"
          echo "anon_key=$anon" >> "$GITHUB_OUTPUT"

      - name: Pull new Jotform submissions
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          curl -fsSL -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sync-jotform-submissions" \
            --data '{}'
          echo

      - name: Evaluate pending submissions
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          curl -fsSL -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/evaluate-schedule-submissions" \
            --data '{}'
          echo
