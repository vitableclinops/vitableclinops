name: ClinOps — Jotform sync + evaluate

# Pulls new Jotform availability submissions into the ClinOps DB and runs
# the evaluator so the Scheduling Workbench shows new providers and shifts
# without manual intervention. Runs every 30 minutes.
#
# Pipeline:
#   1. POST sync-jotform-submissions  → upserts new rows into
#                                       public.schedule_submissions.
#   2. POST evaluate-schedule-submissions → expands pending submissions into
#                                            shift_recommendations rows so
#                                            the workbench's per-shift UI
#                                            populates.
#
# Both functions are invoked through the supabase CLI using the existing
# SUPABASE_ACCESS_TOKEN secret. No additional secrets needed.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinops-jotform-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: bbquooftytwprllipcsb
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity check — token is present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Pull new Jotform submissions
        run: |
          supabase functions invoke sync-jotform-submissions \
            --project-ref "$PROJECT_REF" \
            --method POST \
            --no-verify-jwt

      - name: Evaluate pending submissions
        run: |
          supabase functions invoke evaluate-schedule-submissions \
            --project-ref "$PROJECT_REF" \
            --method POST \
            --no-verify-jwt
