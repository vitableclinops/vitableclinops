name: ClinOps — Daily coverage routing

# Compute-only morning job that runs BEFORE the Slack post window
# (daily-availability-report.yml fires at 13:00/14:00 UTC). It refreshes the
# near-term schedule + Metabase inputs and then runs the deterministic
# same-day / next-day router so send-ops-dashboard-slack just reads a fresh run.
#
# Sequence: sync Homebase → sync Metabase → compute-daily-coverage-routing.
#
# Deployment of the function + migration is handled by the existing
# clinops-deploy-edge-functions.yml and clinops-db-push.yml workflows on push
# to main; this job only invokes already-deployed functions.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN      — used to resolve the project service-role key
#   SYNC_SECRET                — shared secret accepted by sync-metabase
#
# Optional:
#   SUPABASE_SERVICE_ROLE_KEY  — if present, used directly instead of resolving
#                                through the Supabase Management API.

on:
  schedule:
    # 7:00 AM CDT (UTC-5) = 12:00 UTC year-round lower bound — always before
    # the 13:00/14:00 UTC Slack window in both DST regimes.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Single target date (YYYY-MM-DD). Blank = today + tomorrow (America/Chicago).'
        required: false
        type: string
      dry_run:
        description: 'Dry run — compute without persisting a run.'
        required: false
        type: boolean
        default: false
      slack_dry_run:
        description: 'Also dry-run the Slack coverage payload after compute. Never posts.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clinops-daily-coverage
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: bbquooftytwprllipcsb
      SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      TARGET_DATE: ${{ inputs.date }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity check — required secrets
        run: |
          missing=0
          if [ -z "$SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Either SUPABASE_SERVICE_ROLE_KEY or SUPABASE_ACCESS_TOKEN is required."
            missing=1
          fi
          if [ -z "$SYNC_SECRET" ]; then
            echo "::error::SYNC_SECRET is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Resolve service-role key
        run: |
          if [ -n "$SERVICE_ROLE_KEY" ]; then
            echo "::add-mask::$SERVICE_ROLE_KEY"
            exit 0
          fi

          SERVICE_ROLE_KEY="$(
            supabase projects api-keys --project-ref "$PROJECT_REF" --output json |
              node -e '
                const fs = require("fs");
                const raw = fs.readFileSync(0, "utf8");
                const parsed = JSON.parse(raw);
                const keys = Array.isArray(parsed) ? parsed : (parsed.api_keys || parsed.keys || []);
                const service = keys.find((k) => {
                  const label = String(k.name || k.type || k.role || "").toLowerCase();
                  return label.includes("service");
                });
                process.stdout.write(String(service?.api_key || service?.key || service?.value || ""));
              '
          )"

          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::Could not resolve service-role key from Supabase project API keys."
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Sync Homebase (near-term shifts)
        run: |
          RESP_FILE="$(mktemp)"
          set +e
          STATUS=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" -X POST \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sync-homebase" \
            --data '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ "$STATUS" -ge 400 ]; then
            echo "::warning::sync-homebase call failed with status ${STATUS}; continuing"
            head -c 1200 "$RESP_FILE" || true
          else
            echo "sync-homebase ok"
          fi
          echo

      - name: Sync Metabase (demand / utilization / appointments)
        run: |
          RESP_FILE="$(mktemp)"
          set +e
          STATUS=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" -X POST \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "x-sync-secret: $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sync-metabase" \
            --data '{}')
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ "$STATUS" -ge 400 ]; then
            echo "::warning::sync-metabase call failed with status ${STATUS}; continuing"
            head -c 1200 "$RESP_FILE" || true
          else
            echo "sync-metabase ok"
          fi
          echo

      - name: Compute daily coverage routing
        run: |
          if [ -n "$TARGET_DATE" ]; then
            BODY=$(printf '{"run_label":"scheduled_morning","dry_run":%s,"dates":["%s"]}' "${DRY_RUN:-false}" "$TARGET_DATE")
          else
            BODY=$(printf '{"run_label":"scheduled_morning","dry_run":%s}' "${DRY_RUN:-false}")
          fi
          RESP_FILE="$(mktemp)"
          curl -fsSL -o "$RESP_FILE" -X POST \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/compute-daily-coverage-routing" \
            --data "$BODY"
          node - "$RESP_FILE" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.ok !== true) {
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }
          const summary = {
            ok: data.ok,
            dry_run: data.dry_run,
            dates: data.dates,
            demand_source: data.demand_source,
            booked_source: data.booked_source,
            results: (data.results || []).map((r) => ({
              date: r.date,
              state_rows: Array.isArray(r.state_coverage) ? r.state_coverage.length : 0,
              totals: r.totals,
              warnings: Array.isArray(r.warnings) ? r.warnings.length : 0,
            })),
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
          echo

      - name: Slack dry-run coverage payload
        if: ${{ inputs.slack_dry_run == true || inputs.slack_dry_run == 'true' }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            BODY=$(printf '{"dry_run":true,"date":"%s"}' "$TARGET_DATE")
          else
            BODY='{"dry_run":true}'
          fi
          RESP_FILE="$(mktemp)"
          curl -fsSL -o "$RESP_FILE" -X POST \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/send-ops-dashboard-slack" \
            --data "$BODY"
          node - "$RESP_FILE" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (data.success !== true || data.dry_run !== true) {
            console.error(JSON.stringify(data, null, 2));
            process.exit(1);
          }
          const summary = {
            success: data.success,
            dry_run: data.dry_run,
            date: data.date,
            demand_source: data.demand_source,
            booked_source: data.booked_source,
            counts: data.counts,
            attention_count: data.attention_count,
            block_count: Array.isArray(data.blocks) ? data.blocks.length : 0,
            thread_groups: Array.isArray(data.thread) ? data.thread.length : 0,
            text: data.text,
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE
          echo
