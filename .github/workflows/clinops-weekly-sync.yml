name: ClinOps Weekly Sync — Post-Meeting Automation

on:
  schedule:
    # 12:15 PM CDT (UTC-5) = 17:15 UTC — active Mar through Nov
    - cron: '15 17 * * 2'
    # 12:15 PM CST (UTC-6) = 18:15 UTC — active Nov through Mar
    - cron: '15 18 * * 2'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

jobs:
  process-meeting-notes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: workflows/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post-meeting workflow
        env:
          GRANOLA_API_TOKEN: ${{ secrets.GRANOLA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_CLINOPS_TEAM_NAME: ${{ vars.LINEAR_CLINOPS_TEAM_NAME || 'Clinical' }}
          GRANOLA_MEETING_TITLE: ${{ vars.GRANOLA_MEETING_TITLE || 'ClinOps Weekly Sync' }}
          WORKFLOW_DATE: ${{ inputs.date }}
        run: python src/workflow.py
