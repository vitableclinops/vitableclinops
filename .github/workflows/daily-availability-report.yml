name: Daily Availability Report

on:
  # Replaced by the Supabase pg_cron-backed same-next-day-coverage-alert
  # job. Keep workflow_dispatch for manual fallback while the new job beds in.
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string
      dry_run:
        description: 'Dry run — compute report but do not post to Slack.'
        required: false
        type: boolean
        default: false

jobs:
  send-daily-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflows
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: workflows/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily availability report
        working-directory: workflows/src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HOMEBASE_API_KEY: ${{ secrets.HOMEBASE_API_KEY }}
          HOMEBASE_LOCATION_IDS: ${{ secrets.HOMEBASE_LOCATION_IDS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          REPORT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python daily_availability_report.py
