name: ClinOps — Demand forecast

# Builds the monthly demand forecast from Metabase and then re-runs the
# scheduling evaluator for that same month. This is what populates the
# Scheduling Workbench Forecast tab.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/compute-demand-forecast/**'
      - 'supabase/functions/evaluate-schedule-submissions/**'
      - 'supabase/functions/sync-medallion-licenses/**'
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - 'scripts/deploy-edge-functions.sh'
      - '.github/workflows/clinops-demand-forecast.yml'
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Forecast month as YYYY-MM-01'
        required: true
        default: '2026-07-01'
        type: string

permissions:
  contents: read

concurrency:
  group: clinops-demand-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bbquooftytwprllipcsb
      TARGET_MONTH: ${{ inputs.target_month || '2026-07-01' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sanity check — required secrets
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            missing=1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not set."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Link ClinOps project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Repair legacy remote-only migration versions
        run: |
          supabase migration repair --status reverted \
            20260506193208 \
            20260506211752 \
            20260512162717 \
            20260518182326 \
            20260602130013 || true

      - name: Push forecast schema
        run: supabase db push --linked --include-all

      - name: Deploy forecast function
        run: |
          chmod +x scripts/deploy-edge-functions.sh
          scripts/deploy-edge-functions.sh compute-demand-forecast sync-medallion-licenses evaluate-schedule-submissions

      - name: Fetch project anon key
        id: keys
        run: |
          response=$(curl -fsSL \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys")
          anon=$(echo "$response" | jq -r '.[] | select(.name=="anon") | .api_key')
          if [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "::error::Failed to fetch anon key from Management API"
            echo "$response"
            exit 1
          fi
          echo "::add-mask::$anon"
          echo "anon_key=$anon" >> "$GITHUB_OUTPUT"

      - name: Compute demand forecast
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          curl -fsSL -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/compute-demand-forecast?target_month=${TARGET_MONTH}" \
            --data '{}'
          echo

      - name: Sync Medallion licenses
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          curl -fsSL -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/sync-medallion-licenses?allow_missing=1" \
            --data '{}'
          echo

      - name: Re-run evaluator for forecast month
        env:
          ANON_KEY: ${{ steps.keys.outputs.anon_key }}
        run: |
          curl -fsSL -X POST \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/evaluate-schedule-submissions?target_month=${TARGET_MONTH}" \
            --data '{}'
          echo
